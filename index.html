<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .profile-card {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        .profile-card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }
        .social-links a {
            margin: 0 5px;
            text-decoration: none;
            color: #0073b1;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <img src="profile.jpg" alt="Profile Picture" data-testid="profilePicture">
        <h2 data-testid="fullName">Tracy Iyenlanye</h2>
        <h4 data-testid="jobTitle">Front-End Developer</h4>
        <p data-testid="shortBio"> I am a passionate front-end developer with a zeal for creating interactive and responsive user experiences. I am always eager to learn new technologies and collaborate on exciting projects.</p>
        <p data-testid="currentLocation">Lagos, Nigeria</p>
        <p data-testid="emailAddress">tracyvickin46@gmail.com</p>
        <div class="social-links" data-testid="socialLinks">
            <a href="https://linkedin.com/in/johndoe" target="_blank">LinkedIn</a>
            <a href="https://github.com/johndoe" target="_blank">GitHub</a>
            <a href="https://twitter.com/johndoe" target="_blank">Twitter</a>
        </div>
        <p id="utc-time" data-testid="currentTimeUTC"></p>
    </div>
    <script>
        function updateTime() {
            const utcTime = new Date().toUTCString();
            document.getElementById('utc-time').innerText = `Current UTC Time: ${utcTime}`;
        }
        updateTime();
    </script>
</body>
</html>
